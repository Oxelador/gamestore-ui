<div class="add-platform-page">
  <div class="form-card">
    <div class="page-header">
      <h1>Add New Platform</h1>

      <p>Create a new platform in the catalog.</p>
    </div>

    <section class="form-section">
      <h2>Platform Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Platform Name</label>

          <input type="text" placeholder="Enter platform name" [(ngModel)]="newPlatform.type" />
        </div>
      </div>
    </section>
    <div class="actions">
      <span class="hint"> Fill required fields and choose categories before saving. </span>

      <button class="save-btn" (click)="savePlatform()">Save Platform</button>
    </div>
  </div>
</div>
