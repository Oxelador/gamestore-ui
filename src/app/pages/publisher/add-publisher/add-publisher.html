<div class="add-publisher-page">
  <div class="form-card">
    <div class="page-header">
      <h1>Add New Publisher</h1>

      <p>Create a new publisher in the catalog.</p>
    </div>

    <section class="form-section">
      <h2>Publisher Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Company Name</label>

          <input
            type="text"
            placeholder="Enter publisher name"
            [(ngModel)]="newPublisher.companyName"
          />
        </div>
        <div class="form-group">
          <label>Home Page</label>

          <input
            type="text"
            placeholder="Enter publisher home page"
            [(ngModel)]="newPublisher.homePage"
          />
        </div>
        <div class="form-group">
          <label>Description</label>

          <input
            type="text"
            placeholder="Enter publisher description"
            [(ngModel)]="newPublisher.description"
          />
        </div>
      </div>
    </section>
    <div class="actions">
      <span class="hint"> Fill required fields and choose categories before saving. </span>

      <button class="save-btn" (click)="savePublisher()">Save Publisher</button>
    </div>
  </div>
</div>
