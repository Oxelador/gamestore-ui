<div class="add-publisher-page">
  <div class="form-card">
    <div class="page-header">
      <h1>Edit Publisher</h1>
      <p>Update publisher information.</p>
    </div>

    <section class="form-section">
      <h2>Publisher Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Company Name</label>
          <input
            type="text"
            placeholder="Enter publisher name"
            [(ngModel)]="editPublisher.companyName"
          />
        </div>
        <div class="form-group">
          <label>Home Page</label>
          <input
            type="text"
            placeholder="Enter publisher home page"
            [(ngModel)]="editPublisher.homePage"
          />
        </div>
        <div class="form-group">
          <label>Description</label>
          <input
            type="text"
            placeholder="Enter publisher description"
            [(ngModel)]="editPublisher.description"
          />
        </div>
      </div>
    </section>

    <div class="actions">
      <span class="hint">Update fields and save changes.</span>
      <button class="save-btn" (click)="savePublisher()">Save Changes</button>
    </div>
  </div>
</div>
