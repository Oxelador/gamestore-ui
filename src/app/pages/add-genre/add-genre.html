<div class="add-genre-page">
  <div class="form-card">
    <div class="page-header">
      <h1>Add New Genre</h1>

      <p>Create a new genre in the catalog.</p>
    </div>

    <section class="form-section">
      <h2>Genre Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Genre Name</label>

          <input type="text" placeholder="Enter genre name" [(ngModel)]="newGenre.name" />
        </div>
      </div>
    </section>
    <div class="actions">
      <span class="hint"> Fill required fields and choose categories before saving. </span>

      <button class="save-btn" (click)="saveGenre()">Save Genre</button>
    </div>
  </div>
</div>
