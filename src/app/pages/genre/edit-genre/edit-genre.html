<div class="genre-form-page">
  <div class="form-card">
    <div class="page-header">
      <h1>Edit Genre</h1>

      <p>Update genre information.</p>
    </div>

    <section class="form-section">
      <h2>Genre Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Genre Name</label>

          <input type="text" placeholder="Enter genre name" [(ngModel)]="editGenre.name" />
        </div>

        <div class="form-group">
          <label>Parent Genre</label>

          <select [(ngModel)]="editGenre.parentGenreId">
            <option value="">No parent genre</option>

            @for (genre of genres(); track genre.id) {
              @if (genre.id !== genreId) {
                <option [value]="genre.id">
                  {{ genre.name }}
                </option>
              }
            }
          </select>
        </div>
      </div>
    </section>

    <div class="actions">
      <span class="hint"> Update fields and save changes. </span>

      <button class="save-btn" (click)="saveGenre()">Save Changes</button>
    </div>
  </div>
</div>
