<div class="edit-game-page">
  <div class="form-card">
    <div class="page-header">
      <h1>Edit Game</h1>

      <p>Update game information.</p>
    </div>

    <section class="form-section">
      <h2>Game Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Name</label>

          <input type="text" [(ngModel)]="editGame.name" />
        </div>

        <div class="form-group">
          <label>Key</label>

          <input type="text" [(ngModel)]="editGame.key" />
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>

        <textarea rows="6" [(ngModel)]="editGame.description"> </textarea>
      </div>
    </section>

    <section class="form-section">
      <h2>Pricing & Inventory</h2>

      <div class="price-grid">
        <div class="form-group">
          <label>Price</label>

          <input type="number" [(ngModel)]="editGame.price" />
        </div>

        <div class="form-group">
          <label>Discount</label>

          <input type="number" [(ngModel)]="editGame.discount" />
        </div>

        <div class="form-group">
          <label>Units In Stock</label>

          <input type="number" [(ngModel)]="editGame.unitInStock" />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2>Genres</h2>

      <div class="checkbox-grid">
        @for (genre of genres(); track genre.id) {
          <label class="checkbox-item">
            <input
              type="checkbox"
              [checked]="selectedGenres().includes(genre.id)"
              (change)="toggleGenre(genre.id)"
            />

            <span>
              {{ genre.name }}
            </span>
          </label>
        }
      </div>
    </section>

    <section class="form-section">
      <h2>Platforms</h2>

      <div class="checkbox-grid">
        @for (platform of platforms(); track platform.id) {
          <label class="checkbox-item">
            <input
              type="checkbox"
              [checked]="selectedPlatforms().includes(platform.id)"
              (change)="togglePlatform(platform.id)"
            />

            <span>
              {{ platform.type }}
            </span>
          </label>
        }
      </div>
    </section>

    <section class="form-section">
      <h2>Publisher</h2>

      <select [(ngModel)]="selectedPublisher">
        <option value="">Select publisher</option>

        @for (publisher of publishers(); track publisher.id) {
          <option [value]="publisher.id">
            {{ publisher.companyName }}
          </option>
        }
      </select>
    </section>

    <div class="actions">
      <button class="save-btn" (click)="saveChanges()">Save Changes</button>
    </div>
  </div>
</div>
