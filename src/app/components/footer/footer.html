<footer class="footer">
  <div class="column">
    <h3>Site Links</h3>

    <a routerLink="/games" routerLinkActive="active"> Games</a>
    <a routerLink="/genres" routerLinkActive="active"> Genres</a>
    <a routerLink="/platforms" routerLinkActive="active"> Platforms</a>
    <a routerLink="/publishers" routerLinkActive="active"> Publishers</a>
    <a routerLink="/orders" routerLinkActive="active"> Orders</a>
    <a routerLink="/basket" routerLinkActive="active"> Basket </a>

    @if (!currentUser()) {
      <a routerLink="/login" routerLinkActive="active"> Login </a>
    } @else {
      <span class="user-name">
        {{ currentUser()?.firstName + ' ' + currentUser()?.lastName }}
      </span>

      <button class="logout-btn" (click)="logout()">Logout</button>
    }
  </div>

  <div class="column">
    <h3>Company Information</h3>

    <a>About</a>
    <a>Awards</a>
    <a>Reviews</a>
    <a>Testimonials</a>
    <a>Contact</a>
  </div>

  <div class="column">
    <h3>Social Media</h3>

    <div class="socials">
      <span>X</span>
      <span>F</span>
      <span>IG</span>
    </div>
  </div>
</footer>
