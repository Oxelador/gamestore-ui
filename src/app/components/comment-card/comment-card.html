<div class="comment-card">
  <h4>{{ comment().name }}</h4>

  <p>{{ comment().body }}</p>

  <app-rating [value]="comment().rating ?? 0"> </app-rating>

  <div class="comment-actions">
    <button
      type="button"
      [attr.aria-pressed]="comment().isLiked"
      [attr.aria-label]="comment().isLiked ? 'Unlike comment' : 'Like comment'"
      (click)="toggleLike()"
    >
      👍 {{ comment().likes }}
    </button>

    <button (click)="reply()">Reply</button>

    <button (click)="quote()">Quote</button>
  </div>

  @if (comment().childComments.length > 0) {
    <div class="child-comments">
      @for (childComment of comment().childComments; track childComment.id) {
        <app-comment-card
          [comment]="childComment"
          (replyClicked)="replyClicked.emit($event)"
          (quoteClicked)="quoteClicked.emit($event)"
        >
        </app-comment-card>
      }
    </div>
  }
</div>
